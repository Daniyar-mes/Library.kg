<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение регистрации</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow mt-5">
                    <div class="card-header bg-warning text-dark text-center">
                        <h5 class="mb-0">Введите код из письма</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted text-center small">Мы отправили специальный код подтверждения на вашу почту. Введите его ниже, чтобы завершить регистрацию.</p>
                        
                        {% if error %}
                            <div class="alert alert-danger text-center py-2">{{ error }}</div>
                        {% endif %}

                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <input type="text" name="code" class="form-control form-control-lg text-center" placeholder="X X X X X X" required maxlength="6">
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Подтвердить и зарегистрироваться</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
