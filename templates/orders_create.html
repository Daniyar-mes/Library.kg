<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление заказа</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        h2 {
            text-align: center;
            color: #243b55;
        }

        button {
            background: #243b55;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #141e30;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #243b55;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Добавление заказа</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Добавить заказ</button>
    </form>

    <a href="{% url 'order_list' %}">Посмотреть список заказов</a>
</div>

</body>
</html>
