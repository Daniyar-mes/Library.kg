<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление фильмом</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-top: 4px; }
        ul { list-style: none; padding: 0; }
        .btn { padding: 9px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; color: #fff; display: inline-block; }
        .btn-green { background: #28a745; }
        .btn-gray { background: #6c757d; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <a href="{% url 'movie' %}" class="btn btn-gray">← Назад</a>
    <h3>Управление фильмом</h3>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-green">Сохранить</button>
    </form>
</div>
</body>
</html>
