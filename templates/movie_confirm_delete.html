<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление фильма</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 40px 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center; }
        .btn { padding: 9px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; color: #fff; display: inline-block; margin: 5px; }
        .btn-red { background: #dc3545; }
        .btn-gray { background: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <h3>Удалить фильм «{{ object.title }}»?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-red">Да, удалить</button>
        <a href="{% url 'movie_detail' object.id %}" class="btn btn-gray">Отмена</a>
    </form>
</div>
</body>
</html>
